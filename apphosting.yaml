runConfig:
  maxInstances: 1
env:
  - variable: ADMIN_UID
    secret: ADMIN_UID
  - variable: ADMIN_EMAIL
    secret: ADMIN_EMAIL
  - variable: ADMIN_ALLOWED_ORIGIN
    secret: ADMIN_ALLOWED_ORIGIN
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    secret: NEXT_PUBLIC_FIREBASE_APP_CHECK_SITE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_APP_CHECK_ENFORCEMENT_ENABLED
    value: "true"
    availability:
      - BUILD
      - RUNTIME
  - variable: PUBLIC_MUTATION_RATE_LIMIT_SECRET
    secret: PUBLIC_MUTATION_RATE_LIMIT_SECRET
    availability:
      - RUNTIME
  - variable: RETENTION_CLEANUP_SECRET
    secret: RETENTION_CLEANUP_SECRET
    availability:
      - RUNTIME
  - variable: RETENTION_CLEANUP_OIDC_AUDIENCE
    value: "https://sketch.msgnote.kr/api/internal/retention-cleanup"
    availability:
      - RUNTIME
  - variable: RETENTION_CLEANUP_SCHEDULER_SERVICE_ACCOUNT
    value: "retention-cleanup-scheduler@sketch-me-31e13.iam.gserviceaccount.com"
    availability:
      - RUNTIME
