name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test -- tests/unit
      - run: npm run build
      - name: Run Firebase emulator integration tests
        env:
          FIREBASE_PROJECT_ID: sketch-me-local
        run: >-
          npx --no-install firebase emulators:exec
          --only auth,firestore,storage
          --project sketch-me-local
          "npm test -- tests/integration"
