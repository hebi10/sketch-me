name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run lint
      - run: npm test -- tests/unit
      - run: npm run build
      - name: Run Firebase emulator integration tests
        env:
          FIREBASE_PROJECT_ID: sketch-me-local
        run: >-
          npx --no-install firebase emulators:exec
          --only auth,firestore,storage
          --project sketch-me-local
          "npm test -- tests/integration"
      - name: Install browser for mobile E2E
        run: npx --no-install playwright install --with-deps chromium
      - name: Run mobile browser E2E
        run: npm run test:e2e -- --project=mobile-chrome
      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: test-results/
          retention-days: 7
